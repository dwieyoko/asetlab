name: Deploy AsetLab to DomaiNesia

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🔨 Build Production Bundle
        run: npm run build

      - name: 📂 Copy API, .htaccess & Storage Protections to Dist
        run: |
          mkdir -p dist/api dist/storage/private/products dist/uploads/products
          cp -r api/. dist/api/
          rm -f dist/api/secrets.php dist/api/.env
          cp storage/private/products/.htaccess dist/storage/private/products/.htaccess
          cp uploads/products/.htaccess dist/uploads/products/.htaccess

      - name: 🚀 Deploy to DomaiNesia via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        if: ${{ secrets.DOMAINESIA_FTP_PASSWORD != '' }}
        with:
          server: ${{ secrets.DOMAINESIA_FTP_SERVER || '103.147.154.179' }}
          username: ${{ secrets.DOMAINESIA_FTP_USERNAME || 'asetlab_id@asetlab.web.id' }}
          password: ${{ secrets.DOMAINESIA_FTP_PASSWORD }}
          port: 21
          local-dir: ./dist/
          server-dir: /
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            api/secrets.php
            api/.env
            storage/private/products/**
            !storage/private/products/.htaccess
            uploads/products/**
            !uploads/products/.htaccess
