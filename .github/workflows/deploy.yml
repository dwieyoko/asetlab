name: Deploy AsetLab to DomaiNesia

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🔨 Build Production Bundle
        run: npm run build

      - name: 📂 Copy API and .htaccess to Dist
        run: |
          mkdir -p dist/api
          cp -r api/* dist/api/ || true

      - name: 🚀 Deploy to DomaiNesia via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        if: ${{ secrets.DOMAINESIA_FTP_PASSWORD != '' }}
        with:
          server: ${{ secrets.DOMAINESIA_FTP_SERVER || '103.147.154.179' }}
          username: ${{ secrets.DOMAINESIA_FTP_USERNAME || 'asetlab_id@asetlab.web.id' }}
          password: ${{ secrets.DOMAINESIA_FTP_PASSWORD }}
          port: 21
          local-dir: ./dist/
          server-dir: /
          dangerous-clean-slate: false
